<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Трайт — умный помощник (v6)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14161B;
    --panel: #1C1F26;
    --panel-hi: #242832;
    --line: #2C3038;
    --text: #EAE8E3;
    --text-dim: #8A8F99;
    --plus: #4ADE80;
    --zero: #FBBF24;
    --minus: #F87171;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'Manrope', sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: var(--sans);
    overflow: hidden;
  }

  body { display: flex; flex-direction: column; }

  header {
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }

  .brand-row {
    display: flex; align-items: center; justify-content: space-between;
  }

  .brand {
    font-family: var(--mono);
    font-size: 15px; font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--text);
  }

  .brand span { color: var(--text-dim); font-weight: 400; }

  .trit-panel {
    display: flex; gap: 7px; align-items: center;
  }

  .trit-lamp {
    width: 9px; height: 9px; border-radius: 50%;
    background: #333844;
    transition: all .35s cubic-bezier(.4,0,.2,1);
  }

  .trit-lamp.active-minus { background: var(--minus); box-shadow: 0 0 10px 1px rgba(248,113,113,.55); }
  .trit-lamp.active-zero  { background: var(--zero);  box-shadow: 0 0 10px 1px rgba(251,191,36,.55); }
  .trit-lamp.active-plus  { background: var(--plus);  box-shadow: 0 0 10px 1px rgba(74,222,128,.55); }
  .trit-lamp.pulse { animation: pulse 1.1s ease-in-out infinite; }

  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50% { opacity: .45; transform: scale(0.82); }
  }

  .trit-label {
    font-family: var(--mono); font-size: 10px; color: var(--text-dim);
    letter-spacing: 0.08em; margin-top: 6px;
  }

  .controls {
    display: flex; gap: 6px; align-items: center;
  }

  .controls button {
    background: var(--panel-hi);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 11px;
    font-family: var(--mono);
    cursor: pointer;
    transition: border-color .15s;
  }

  .controls button:hover { border-color: var(--zero); }

  main {
    flex: 1; overflow-y: auto;
    padding: 18px 16px 8px;
    display: flex; flex-direction: column; gap: 14px;
  }

  .empty-state {
    margin: auto; text-align: center; max-width: 280px;
    color: var(--text-dim);
  }
  .empty-state .glyph {
    font-family: var(--mono); font-size: 28px; color: var(--text-dim);
    letter-spacing: 0.3em; margin-bottom: 14px;
  }
  .empty-state p { font-size: 14px; line-height: 1.5; margin: 0; }

  .msg {
    max-width: 88%;
    font-size: 15px; line-height: 1.5;
    animation: rise .28s ease-out;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    align-self: flex-end;
    background: var(--panel-hi);
    padding: 10px 14px;
    border-radius: 14px 14px 3px 14px;
  }

  .msg.system {
    align-self: flex-start;
    width: 100%; max-width: 100%;
  }

  .status-line {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: 11px;
    color: var(--text-dim); letter-spacing: 0.05em;
    margin-bottom: 6px;
  }
  .status-line .tag {
    padding: 2px 7px; border-radius: 4px;
    font-weight: 600;
  }
  .tag.plus  { background: rgba(74,222,128,.14); color: var(--plus); }
  .tag.zero  { background: rgba(251,191,36,.14); color: var(--zero); }
  .tag.minus { background: rgba(248,113,113,.14); color: var(--minus); }

  .answer-text {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 3px 14px 14px 14px;
    padding: 12px 14px;
    white-space: pre-wrap;
  }

  .interp-list {
    display: flex; flex-direction: column; gap: 8px; margin-top: 10px;
  }
  .interp-btn {
    text-align: left;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 11px 14px;
    border-radius: 10px;
    font-family: var(--sans); font-size: 14px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .interp-btn:hover, .interp-btn:active {
    border-color: var(--zero);
    background: var(--panel-hi);
  }
  .interp-btn .num {
    font-family: var(--mono); color: var(--zero);
    margin-right: 8px; font-size: 12px;
  }

  .thinking {
    display: flex; gap: 5px; padding: 4px 0;
  }
  .thinking span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-dim);
    animation: bounce 1.1s ease-in-out infinite;
  }
  .thinking span:nth-child(2) { animation-delay: .15s; }
  .thinking span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce {
    0%,60%,100% { transform: translateY(0); opacity: .4; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  footer {
    flex-shrink: 0;
    padding: 12px 14px calc(14px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
    background: var(--bg);
  }

  .input-row {
    display: flex; align-items: flex-end; gap: 8px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 6px 6px 6px 16px;
  }

  #textInput {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text); font-family: var(--sans); font-size: 15px;
    resize: none; max-height: 100px; padding: 8px 0;
    line-height: 1.4;
  }
  #textInput::placeholder { color: var(--text-dim); }

  .icon-btn {
    width: 38px; height: 38px; border-radius: 50%;
    border: none; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background .15s, transform .1s;
    color: var(--text);
    background: var(--panel-hi);
  }
  .icon-btn:active { transform: scale(0.92); }

  .icon-btn.mic.listening {
    background: var(--minus);
    animation: mic-pulse 1s ease-in-out infinite;
  }
  @keyframes mic-pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(248,113,113,.5); }
    50% { box-shadow: 0 0 0 8px rgba(248,113,113,0); }
  }

  .icon-btn.send {
    background: var(--plus); color: #0B1410;
  }
  .icon-btn.send:disabled {
    background: var(--panel-hi); color: var(--text-dim);
    cursor: default;
  }

  svg { width: 18px; height: 18px; }
</style>
</head>
<body>

<header>
  <div class="brand-row">
    <div class="brand">ТРАЙТ <span>/ умный помощник</span></div>
    <div style="display:flex;align-items:center;gap:12px;">
      <div class="controls">
        <button id="resetBtn">↺ сброс</button>
      </div>
      <div>
        <div class="trit-panel" id="tritPanel">
          <div class="trit-lamp" data-state="minus"></div>
          <div class="trit-lamp" data-state="zero"></div>
          <div class="trit-lamp" data-state="plus"></div>
        </div>
        <div class="trit-label" id="tritLabel">L3 · ожидание</div>
      </div>
    </div>
  </div>
</header>

<main id="chatArea">
  <div class="empty-state" id="emptyState">
    <div class="glyph">−1&nbsp;&nbsp;0&nbsp;&nbsp;+1</div>
    <p>Спросите что угодно — текстом или голосом.<br>
    Если вопрос неполный, помощник уточнит,<br>
    вместо того чтобы гадать.</p>
  </div>
</main>

<footer>
  <div class="input-row">
    <textarea id="textInput" placeholder="Спросите что-нибудь…" rows="1"></textarea>
    <button class="icon-btn mic" id="micBtn" title="Голосовой ввод">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
    </button>
    <button class="icon-btn send" id="sendBtn" title="Отправить">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
</footer>

<script>
const chatArea = document.getElementById('chatArea');
const emptyState = document.getElementById('emptyState');
const textInput = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');
const micBtn = document.getElementById('micBtn');
const resetBtn = document.getElementById('resetBtn');
const tritPanel = document.getElementById('tritPanel');
const tritLabel = document.getElementById('tritLabel');

let conversationHistory = [];

// ---------- Загрузка истории из localStorage ----------
try {
  const saved = localStorage.getItem('trait_history');
  if (saved) {
    const parsed = JSON.parse(saved);
    if (Array.isArray(parsed)) {
      conversationHistory = parsed;
      hideEmptyState();
      parsed.forEach(msg => {
        if (msg.role === 'user') {
          addUserMessage(msg.content);
        } else if (msg.role === 'assistant') {
          addAnswerMessage(msg.content, msg.l3 || 0);
        }
      });
    }
  }
} catch(e) {}

// ---------- Сохранение истории ----------
function saveHistory() {
  try {
    localStorage.setItem('trait_history', JSON.stringify(conversationHistory));
  } catch(e) {}
}

// ---------- L3-индикатор ----------
function setTritState(state, thinking) {
  tritPanel.querySelectorAll('.trit-lamp').forEach(l => {
    l.className = 'trit-lamp';
  });
  const labels = {
    plus:  'L3 = +1 · уверен',
    zero:  'L3 = 0 · уточняю',
    minus: 'L3 = −1 · конфликт',
    null:  'L3 · ожидание'
  };
  if (thinking) {
    const lamp = tritPanel.querySelector('[data-state="zero"]');
    lamp.classList.add('active-zero', 'pulse');
    tritLabel.textContent = 'L3 · анализ…';
    return;
  }
  if (state) {
    const lamp = tritPanel.querySelector(`[data-state="${state}"]`);
    lamp.classList.add('active-' + state);
  }
  tritLabel.textContent = labels[state] || labels.null;
}

// ---------- Рендеринг сообщений ----------
function hideEmptyState() {
  if (emptyState && emptyState.parentNode) {
    emptyState.remove();
  }
}

function addUserMessage(text) {
  hideEmptyState();
  const div = document.createElement('div');
  div.className = 'msg user';
  div.textContent = text;
  chatArea.appendChild(div);
  scrollDown();
}

function addThinkingMessage() {
  hideEmptyState();
  const div = document.createElement('div');
  div.className = 'msg system';
  div.id = 'thinkingMsg';
  div.innerHTML = `<div class="thinking"><span></span><span></span><span></span></div>`;
  chatArea.appendChild(div);
  scrollDown();
}

function removeThinkingMessage() {
  const el = document.getElementById('thinkingMsg');
  if (el) el.remove();
}

function addAnswerMessage(text, l3) {
  const tagClass = l3 === 1 ? 'plus' : l3 === -1 ? 'minus' : 'zero';
  const tagText = l3 === 1 ? 'L3 +1 · ответ' : l3 === -1 ? 'L3 −1 · конфликт' : 'L3 0 · уточнение';
  const div = document.createElement('div');
  div.className = 'msg system';
  div.innerHTML = `
    <div class="status-line"><span class="tag ${tagClass}">${tagText}</span></div>
    <div class="answer-text"></div>
  `;
  div.querySelector('.answer-text').textContent = text;
  chatArea.appendChild(div);
  scrollDown();
  saveHistory();
}

function addInterpretationChoices(interpretations, originalQuery) {
  const div = document.createElement('div');
  div.className = 'msg system';
  div.innerHTML = `
    <div class="status-line"><span class="tag zero">L3 0 · несколько прочтений</span></div>
    <div class="answer-text">Уточните, что вы имели в виду:</div>
    <div class="interp-list"></div>
  `;
  const list = div.querySelector('.interp-list');
  interpretations.forEach((interp, i) => {
    const btn = document.createElement('button');
    btn.className = 'interp-btn';
    btn.innerHTML = `<span class="num">${i+1}</span>${interp}`;
    btn.onclick = () => handleInterpretationChoice(interp, originalQuery);
    list.appendChild(btn);
  });
  chatArea.appendChild(div);
  scrollDown();
  saveHistory();
}

function scrollDown() {
  chatArea.scrollTop = chatArea.scrollHeight;
}

// ---------- Локальный агент (имитация v6) ----------
function localAgent(userText) {
  return new Promise((resolve) => {
    const lower = userText.toLowerCase();
    let l3 = 0;
    let answer = '';
    let interpretations = null;

    if (lower.includes('привет') || lower.includes('здравствуй')) {
      l3 = 1;
      answer = 'Здравствуйте, Root-Architect. Я — Трайт, ваш умный помощник на базе архитектуры v6. Чем могу помочь?';
    } else if (lower.includes('как дела') || lower.includes('как ты')) {
      l3 = 1;
      answer = 'Я работаю стабильно. Мой L3-статус в норме. Готов к вашему запросу.';
    } else if (lower.includes('кто ты') || lower.includes('ты кто')) {
      l3 = 1;
      answer = 'Я — Трайт, интерфейс к архитектуре v6. Я создан, чтобы помогать вам, показывая троичную логику и L3-статус в реальном времени.';
    } else if (lower.includes('стоп')) {
      l3 = -1;
      answer = '⚠️ ВЕТО АКТИВИРОВАНО. Я остановлен по вашему требованию.';
    } else if (lower.includes('старт') || lower.includes('продолжить')) {
      l3 = 1;
      answer = 'Я возобновил работу. Ожидаю ваш запрос.';
    } else if (lower.includes('память')) {
      l3 = 1;
      const last = conversationHistory.slice(-3);
      if (last.length === 0) {
        answer = 'Память пуста.';
      } else {
        answer = 'Последние записи:\n' + last.map(m => `${m.role}: ${m.content}`).join('\n');
      }
    } else if (lower.includes('конфликт') || lower.includes('противоречие')) {
      l3 = -1;
      answer = 'Обнаружен конфликт в запросе. Уточните, что вы имеете в виду.';
    } else if (lower.includes('неопределённость') || lower.includes('непонятно')) {
      l3 = 0;
      interpretations = [
        'Вы имеете в виду неопределённость в данных?',
        'Вы говорите о неопределённости в решении?',
        'Вы спрашиваете, как система обрабатывает неопределённость?'
      ];
    } else {
      l3 = 0;
      interpretations = [
        'Вы хотите узнать подробнее о троичной логике?',
        'Вы спрашиваете о возможностях архитектуры v6?',
        'Вы ищете конкретный пример работы системы?'
      ];
    }

    resolve({ l3, answer, interpretations });
  });
}

// ---------- Обработка запроса ----------
async function classifyAndRespond(userText) {
  addThinkingMessage();
  setTritState(null, true);

  try {
    const result = await localAgent(userText);

    removeThinkingMessage();

    if (result.l3 === 1) {
      setTritState('plus', false);
      addAnswerMessage(result.answer, 1);
      conversationHistory.push({ role: 'user', content: userText });
      conversationHistory.push({ role: 'assistant', content: result.answer, l3: 1 });
    } else if (result.l3 === 0 && result.interpretations) {
      setTritState('zero', false);
      addInterpretationChoices(result.interpretations, userText);
    } else if (result.l3 === -1) {
      setTritState('minus', false);
      addAnswerMessage(result.answer || 'Противоречие в вопросе.', -1);
      conversationHistory.push({ role: 'user', content: userText });
      conversationHistory.push({ role: 'assistant', content: result.answer || 'Противоречие', l3: -1 });
    } else {
      setTritState('zero', false);
      addAnswerMessage('Не удалось обработать запрос. Попробуйте уточнить.', 0);
    }
    saveHistory();
  } catch (err) {
    removeThinkingMessage();
    setTritState('minus', false);
    addAnswerMessage('Ошибка обработки. Попробуйте снова.', -1);
    console.error(err);
  }
}

async function handleInterpretationChoice(chosenInterpretation, originalQuery) {
  addUserMessage(chosenInterpretation);
  addThinkingMessage();
  setTritState(null, true);

  const clarifiedQuery = `Исходный вопрос: "${originalQuery}". Уточнение: "${chosenInterpretation}". Ответь на уточнённый вопрос.`;

  try {
    const result = await localAgent(clarifiedQuery);
    removeThinkingMessage();
    setTritState('plus', false);
    addAnswerMessage(result.answer || '…', 1);
    conversationHistory.push({ role: 'user', content: clarifiedQuery });
    conversationHistory.push({ role: 'assistant', content: result.answer || '…', l3: 1 });
    saveHistory();
  } catch (err) {
    removeThinkingMessage();
    setTritState('minus', false);
    addAnswerMessage('Ошибка при уточнении. Попробуйте снова.', -1);
  }
}

// ---------- Отправка сообщения ----------
function handleSend() {
  const text = textInput.value.trim();
  if (!text) return;
  addUserMessage(text);
  textInput.value = '';
  textInput.style.height = 'auto';
  classifyAndRespond(text);
}

// ---------- Сброс диалога ----------
function resetChat() {
  conversationHistory = [];
  localStorage.removeItem('trait_history');
  chatArea.innerHTML = `<div class="empty-state" id="emptyState">
    <div class="glyph">−1&nbsp;&nbsp;0&nbsp;&nbsp;+1</div>
    <p>Спросите что угодно — текстом или голосом.<br>
    Если вопрос неполный, помощник уточнит,<br>
    вместо того чтобы гадать.</p>
  </div>`;
  setTritState(null, false);
}

// ---------- События ----------
sendBtn.addEventListener('click', handleSend);
resetBtn.addEventListener('click', resetChat);

textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});
textInput.addEventListener('input', () => {
  textInput.style.height = 'auto';
  textInput.style.height = Math.min(textInput.scrollHeight, 100) + 'px';
});

// ---------- Голосовой ввод ----------
let recognition = null;
let isListening = false;

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = 'ru-RU';
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = () => {
    isListening = true;
    micBtn.classList.add('listening');
  };
  recognition.onend = () => {
    isListening = false;
    micBtn.classList.remove('listening');
  };
  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    textInput.value = transcript;
    handleSend();
  };
  recognition.onerror = () => {
    isListening = false;
    micBtn.classList.remove('listening');
  };

  micBtn.addEventListener('click', () => {
    if (isListening) {
      recognition.stop();
    } else {
      recognition.start();
    }
  });
} else {
  micBtn.addEventListener('click', () => {
    alert('Голосовой ввод не поддерживается этим браузером. Используйте текст.');
  });
}
</script>
</body>
</html>
